<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex, nofollow">

  <title>Painel administrativo — Mimo Cookies</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="admin.css?v=2">
</head>

<body>
  <main class="admin-shell">

    <section class="login-card" id="login-section">
      <p class="eyebrow">Mimo Cookies</p>
      <h1>Painel administrativo</h1>

      <p class="muted">
        Entre com a conta administrativa cadastrada no Supabase.
      </p>

      <form id="login-form">
        <label>
          E-mail
          <input
            id="login-email"
            type="email"
            autocomplete="email"
            required
          >
        </label>

        <label>
          Senha
          <input
            id="login-password"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>

        <button type="submit">
          Entrar
        </button>

        <p class="message" id="login-message" aria-live="polite"></p>
      </form>
    </section>

    <section class="dashboard" id="dashboard" hidden>
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">Mimo Cookies</p>
          <h1>Gerenciar cardápio</h1>
          <p class="muted" id="admin-email"></p>
        </div>

        <div class="header-actions">
          <a href="../" target="_blank" rel="noopener">
            Ver loja
          </a>

          <button class="secondary-button" id="logout-button" type="button">
            Sair
          </button>
        </div>
      </header>

      <div class="dashboard-grid">

        <section class="panel form-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow" id="form-eyebrow">Novo sabor</p>
              <h2 id="form-title">Adicionar produto</h2>
            </div>

            <button
              class="text-button"
              id="cancel-edit-button"
              type="button"
              hidden
            >
              Cancelar edição
            </button>
          </div>

          <form id="product-form">
            <input id="product-id" type="hidden">

            <label>
              Nome do sabor
              <input
                id="product-name"
                type="text"
                placeholder="Ex.: Pistache"
                required
              >
            </label>

            <label>
              Identificador
              <input
                id="product-slug"
                type="text"
                placeholder="Ex.: pistache"
                required
              >
              <small>
                Use letras minúsculas, números e hífens.
              </small>
            </label>

            <div class="form-row">
              <label>
                Preço
                <input
                  id="product-price"
                  type="number"
                  min="0"
                  step="0.01"
                  placeholder="15,00"
                  required
                >
              </label>

              <label>
                Ordem
                <input
                  id="product-order"
                  type="number"
                  min="0"
                  step="1"
                  value="0"
                  required
                >
              </label>
            </div>

            <label>
              Descrição
              <textarea
                id="product-description"
                rows="4"
                placeholder="Descreva a massa, o recheio e a finalização."
                required
              ></textarea>
            </label>

            <label>
              Caminho da imagem
              <input
                id="product-image"
                type="text"
                placeholder="assets/images/pistache.webp"
                required
              >
            </label>

            <label>
              Estoque
              <input
                id="product-stock"
                type="number"
                min="0"
                step="1"
                placeholder="Deixe vazio para não controlar quantidade"
              >
            </label>

            <label class="checkbox-label">
              <input id="product-available" type="checkbox" checked>
              <span>Produto disponível no cardápio</span>
            </label>

            <button id="save-product-button" type="submit">
              Salvar produto
            </button>

            <p class="message" id="product-message" aria-live="polite"></p>
          </form>
        </section>

        <section class="panel products-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Cardápio</p>
              <h2>Sabores cadastrados</h2>
            </div>

            <button
              class="secondary-button"
              id="refresh-button"
              type="button"
            >
              Atualizar
            </button>
          </div>

          <div class="products-list" id="products-list">
            <p class="muted">Carregando produtos...</p>
          </div>
        </section>

      </div>

      <section class="panel orders-panel">
  <div class="panel-heading">
    <div>
      <p class="eyebrow">Pedidos</p>
      <h2>Pedidos recebidos</h2>
    </div>

    <button
      class="secondary-button"
      id="refresh-orders-button"
      type="button"
    >
      Atualizar
    </button>
  </div>

  <div class="orders-list" id="orders-list">
    <p class="muted">Carregando pedidos...</p>
  </div>
</section>
      
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js?v=1"></script>
  <script src="admin.js?v=2"></script>
</body>
</html>
